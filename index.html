  <body>
    <!-- Solo se ve en celulares y tablets chicas (lo decide app.css): tapa el editor entero -->
    <div id="solo-pc" role="alert">
      <strong>WebEdiThor</strong>
      <p>El editor solo funciona en computadora. 💻<br />Ábrelo desde tu PC para probarlo.</p>
      <p lang="en">The editor only works on desktop. Open it on your computer to try it.</p>
    </div>
    <!-- Layout del editor: 3 columnas. Cada una la llena un módulo de src/ui/ -->
    <div id="app">
      <header id="toolbar"></header>
      <aside id="sidebar" aria-label="Secciones"></aside>
      <main id="preview" aria-label="Vista previa"></main>
      <aside id="inspector" aria-label="Propiedades"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
