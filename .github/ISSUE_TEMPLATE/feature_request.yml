name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The animation list in `FEATURES.md` is the official scope and is curated by the maintainer. Ideas are welcome; changes to that list get discussed before any code.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or goal, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Other tools that do it well, links, mock-ups, a CSS snippet...
  - type: dropdown
    id: css
    attributes:
      label: Could it be plain CSS in the export?
      description: CSS-first is a core rule. It's fine to not know.
      options:
        - Yes, I think so
        - No, it needs JavaScript
        - Not sure
